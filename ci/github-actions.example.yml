# Vorlage – NICHT aktiv. Aktivieren: nach .github/workflows/ci.yml kopieren (Runner mit Projektdaten nötig).
name: ci
on: [push, pull_request]
jobs:
  algorithmus:
    runs-on: self-hosted          # Server mit /workspace/scenic-Daten (features.gpkg)
    steps:
      - uses: actions/checkout@v4
      - run: venv/bin/python -m pytest -q tests
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: webapp } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: python3 ../app/tools/gen_tokens.py --check   # Kontrasttest: alle Token-Paare WCAG AA
      - run: npm ci && npm run lint   # ESLint inkl. style-Regel + scripts/check-tokens.mjs && npx vitest run && npm run build
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: ./gradlew :shared:jvmTest :androidApp:testDebugUnitTest
