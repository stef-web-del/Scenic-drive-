# Alternative: GitLab CI (Free-Tier Shared Runner)
frontend-tests:
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  variables: { CI: "true" }
  cache: { key: npm, paths: [.npm/] }
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run test:all
    - npm run test:lighthouse
  artifacts:
    when: always
    paths: [playwright-report/, test-results/, coverage/, .lighthouseci/]
    expire_in: 14 days
